<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Путеводитель в мир IT: ракета взлетает с лестницы из блоков кода">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1B6B"/>
      <stop offset="1" stop-color="#5B2A9E"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE14D"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="38" cy="44" r="3"/><circle cx="92" cy="26" r="2"/><circle cx="214" cy="58" r="2.5"/>
      <circle cx="58" cy="104" r="2"/><circle cx="226" cy="132" r="2"/><circle cx="150" cy="22" r="1.8"/>
      <path d="M196 24 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFE14D"/>
    </g>
    <!-- code blocks: a staircase, one step per level -->
    <g stroke="#1B1140" stroke-width="0">
      <path d="M0 214 h22 a6 6 0 0 0 6 6 h20 a6 6 0 0 0 6 -6 h34 v42 h-88z" fill="#FFBF1F"/>
      <path d="M88 178 h22 a6 6 0 0 0 6 6 h20 a6 6 0 0 0 6 -6 h34 v78 h-88z" fill="#4CC36B"/>
      <path d="M176 142 h22 a6 6 0 0 0 6 6 h20 a6 6 0 0 0 6 -6 h26 v114 h-80z" fill="#3D8BFF"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="22" fill="#1B1140">
      <text x="20" y="245">&gt;_</text>
      <text x="104" y="222">{ }</text>
      <text x="190" y="190">&lt;/&gt;</text>
    </g>
    <!-- rocket, launching up and right from the top step -->
    <g transform="translate(150 112) rotate(35)">
      <path d="M-9 34 Q0 70 9 34z" fill="url(#flame)"/>
      <path d="M-14 18 l-14 20 14 -4z" fill="#FF4F6D"/>
      <path d="M14 18 l14 20 -14 -4z" fill="#FF4F6D"/>
      <path d="M0 -46 C22 -24 20 14 14 34 h-28 C-20 14 -22 -24 0 -46z" fill="#F4F1FF"/>
      <path d="M0 -46 C9 -37 14 -27 16 -18 h-32 C-14 -27 -9 -37 0 -46z" fill="#FF4F6D"/>
      <circle cx="0" cy="2" r="8.5" fill="#3D8BFF" stroke="#1B1140" stroke-width="3.5"/>
    </g>
  </g>
</svg>
